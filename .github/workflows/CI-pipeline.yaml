name: HR App CI Pipeline

on:
  push:
    branches:
      - hr-repo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Docker Hub login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login docker.io \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t mainakdas73/hr-app:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push mainakdas73/hr-app:${{ github.sha }}

    - name: Tag & Push latest
      run: |
        docker tag mainakdas73/hr-app:${{ github.sha }} mainakdas73/hr-app:latest
        docker push mainakdas73/hr-app:latest

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/hr-app \
          hr-app=mainakdas73/hr-app:${{ github.sha }} \
          -n docker-ns
