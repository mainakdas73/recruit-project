name: HR App CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout source code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Login to Docker Hub
    - name: Docker Hub login
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login \
        -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    # 3️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build -t mainakdas73/hr-app:${{ github.sha }} .

    # 4️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push mainakdas73/hr-app:${{ github.sha }}

    # 5️⃣ Setup kubeconfig
    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

    # 6️⃣ Deploy to Kubernetes (docker-ns)
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/hr-app \
        hr-app=mainakdas73/hr-app:${{ github.sha }} \
        -n docker-ns
